
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | GameZone</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header>

        <h1> GAMEZONE</h1>

        <nav>

            <a href="index.html">Inicio</a>

            <a href="juegos.html">Videojuegos</a>

            <a href="generos.html">Géneros</a>

            <a href="contacto.html">Contacto</a>

        </nav>

    </header>


    <main>

        <section class="contacto">

            <h2>📩 Contáctanos</h2>

            <p>
                ¿Tienes alguna sugerencia o quieres compartir
                tu videojuego favorito? Escríbenos.
            </p>


            <form>


                <label for="nombre">Nombre:</label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Escribe tu nombre"
                    required
                >


                <label for="correo">Correo electrónico:</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required
                >


                <label for="videojuego">Videojuego favorito:</label>

                <select id="videojuego" name="videojuego">

                    <option value="">Selecciona uno</option>

                    <option value="minecraft">Minecraft</option>

                    <option value="fortnite">Fortnite</option>

                    <option value="hollow-knight">Hollow Knight</option>

                    <option value="gta-v">GTA V</option>

                    <option value="resident-evil">Resident Evil 4</option>

                    <option value="zelda">The Legend of Zelda</option>

                </select>


                <label for="mensaje">Mensaje:</label>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="6"
                    placeholder="Escribe tu mensaje..."
                ></textarea>


                <button type="submit">Enviar mensaje</button>


            </form>

        </section>

    </main>


    <footer>

        <p>© 2026 GameZone | Proyecto escolar</p>

    </footer>


</body>

</html>
